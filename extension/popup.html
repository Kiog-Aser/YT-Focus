<!doctype html><html><head><meta charset="utf-8"/><title>YT Focus Settings</title><style>body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#0d0f17;color:#cdd6f4;margin:0;padding:16px;min-width:280px}h1{font-size:18px;margin:0 0 16px 0;color:#89b4fa;font-weight:600}label{display:flex;align-items:center;gap:10px;font-size:14px;margin-bottom:12px;padding:12px;background:#1e293b;border-radius:8px;border:1px solid #313244}input[type=checkbox]{width:18px;height:18px;cursor:pointer;accent-color:#89b4fa}small{display:block;opacity:.7;margin-top:4px;font-size:12px;color:#94a3b8}.note{margin-top:16px;font-size:12px;line-height:1.4;opacity:.75;background:#1e293b;padding:12px;border-radius:8px;border-left:4px solid #89b4fa}.section{margin-bottom:20px}.section-title{font-size:14px;color:#f38ba8;margin-bottom:8px;font-weight:500}</style></head><body><h1>🎯 YT Focus Settings</h1><div class="section"><div class="section-title">🎮 Controls</div><form id="settings-form"><label><input type="checkbox" id="enableQuit"/> <span>Enable 'q' to quit focus mode</span><small>Toggle whether pressing 'q' closes the overlay</small></label><label><input type="checkbox" id="disableAutoplay"/> <span>Disable YouTube autoplay</span><small>Prevents videos from auto-playing</small></label></form></div><div class="note">✨ <strong>Changes apply instantly!</strong><br>Press 'f' on YouTube to activate focus mode</div><script src="popup.js"></script></body></html>
